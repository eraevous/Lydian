# Reusable workflow: the one CI every Kairos repo calls. Lives only in the kit repo.
# Consumers call it from a ~10-line workflow (examples/caller/kairos.yml) and never edit it again.
# The job is named kairos-checks, so every repo's ruleset requires the same single check.
name: kairos-checks
on:
  workflow_call:
    inputs:
      suite:
        description: Central suite (profile) to run, e.g. kairos-v1
        type: string
        default: kairos-v1
      adapter:
        description: Path of the consumer's adapter file
        type: string
        default: .kairos/adapter.json
      kit_ref:
        description: Must equal the @ref in the caller's `uses:` line (a reusable workflow can't reliably read its own ref)
        type: string
        default: main
permissions:
  contents: read            # read-only token: candidate code gets no write access
jobs:
  kairos-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Consumer checkout
        uses: actions/checkout@v4
        # Full history, so the telosmith module can snapshot the PR base for code-impact.
        with: { path: repo, persist-credentials: false, fetch-depth: 0 }
      - name: Kit checkout (the same revision the caller pinned)
        uses: actions/checkout@v4
        with:
          repository: eraevous/Lydian
          ref: ${{ inputs.kit_ref }}
          path: kit
          persist-credentials: false
      - name: Telosmith checkout (pinned by the kit, not by consumers)
        uses: actions/checkout@v4
        with:
          repository: eraevous/Telosmith
          ref: c5ed7af92584ea3edc046c5594defdf08a3cbbb3
          path: telosmith
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run the central suite
        shell: bash   # bash -eo pipefail: a failing kit run must fail the step even though tee succeeds
        env:
          KAIROS_TELOSMITH_SRC: ${{ github.workspace }}/telosmith/src
          KAIROS_REPOSITORY: ${{ github.repository }}
          # Inputs reach the script through env, never as ${{ }} inside run: (script injection).
          KAIROS_SUITE: ${{ inputs.suite }}
          KAIROS_ADAPTER: ${{ inputs.adapter }}
          # Code-impact (report-only, DEC-256): the event's base revision; the kit skips it when absent.
          KAIROS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          KAIROS_CODE_IMPACT_OUT: ${{ runner.temp }}/code-impact.md
          # Pull-request guards (test-tampering, new-dependencies, closing-keywords): read from the event
          # payload, never from the repository. Empty outside a pull request, where they check nothing.
          # A re-run reuses the payload, so a body edit takes effect on the next push, or at once where
          # the caller triggers on `edited` (examples/caller/kairos.yml).
          KAIROS_EVENT_NAME: ${{ github.event_name }}
          KAIROS_PR_BODY: ${{ github.event.pull_request.body }}
          KAIROS_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          KAIROS_PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
        run: |
          [[ "$KAIROS_SUITE" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "suite must name a file in Lydian's suites/" >&2; exit 2; }
          python3 -I -B kit/kit/run.py --repo repo \
            --adapter "repo/$KAIROS_ADAPTER" \
            --suite "kit/suites/$KAIROS_SUITE.json" | tee report.json
      - name: Report in the job summary
        if: always()
        run: |
          { echo '## kairos-checks'; echo '```json'; cat report.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Written by the telosmith module only when it ran; absent for repos that don't enable it.
          if [ -f "$RUNNER_TEMP/code-impact.md" ]; then cat "$RUNNER_TEMP/code-impact.md" >> "$GITHUB_STEP_SUMMARY"; fi
