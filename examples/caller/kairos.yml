# The whole per-repo CI. Copy once into .github/workflows/kairos.yml; never edit per test change.
# @main (DEC-210): a merged Lydian change reaches every repo on its next run; no tag to move. Rollback: revert on Lydian main, or pin to a full SHA.
name: kairos
# Pushes to the default branch plus pull requests: one run per PR update, not two.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    uses: eraevous/Lydian/.github/workflows/kairos-checks.yml@main
    with:
      suite: kairos-v1
      kit_ref: main   # keep equal to the @ref above
